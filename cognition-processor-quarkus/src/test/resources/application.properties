# Test configuration
quarkus.log.level=INFO
quarkus.log.category."io.github.rigazilla.memory".level=DEBUG

# Memory service connection (no real server; stubs are injected per test)
memory-service.grpc.host=localhost
memory-service.grpc.port=50051
memory-service.api-key=test-api-key
memory-service.client-id=test-client

# Cognition processor settings
cognition.scheduler.debounce-delay=PT1S
cognition.scheduler.max-batch-age=PT5S
cognition.worker.id=test-worker
cognition.runtime.id=test-runtime
cognition.runtime.version=1.0.0-test
cognition.checkpoint.reset-on-startup=false
cognition.llm.backfill.inter-call-delay-ms=0
cognition.secrets.provider=env
cognition.contradiction.max-memories-per-namespace=50

# Disable health checks in tests
quarkus.health.extensions.enabled=false

# LLM configuration real providers are mocked in tests; supply dummy values to satisfy config validation
quarkus.langchain4j.openai.memory.api-key=test-key-not-used
quarkus.langchain4j.openai.memory.base-url=http://localhost:11434
quarkus.langchain4j.openai.memory.timeout=5s
