# Cognition Processor Configuration

# Memory Service gRPC connection
# Memory Service exposes gRPC on the same HTTP port using HTTP/2
# Docker Compose maps internal 8080 to external 8082
memory-service.grpc.host=localhost
memory-service.grpc.port=8082

# Memory Service authentication and authorization
# API key: dedicated key for cognition_processor client (must match MEMORY_SERVICE_API_KEYS_COGNITION_PROCESSOR)
# Client ID: must be listed in MEMORY_SERVICE_ROLES_ADMIN_CLIENTS for admin role
# NOTE: Use underscore not dash - memory-service converts env var names to lowercase with underscores
memory-service.api-key=${MEMORY_SERVICE_API_KEY}
memory-service.client-id=cognition_processor

# Worker identity (must match API key's client_id for checkpoint auth)
# cognition-processor-key-123 has client_id="cognition_processor" in memory-service
cognition.worker.id=cognition_processor
cognition.runtime.id=cognition-processor-v1
cognition.runtime.version=1.0.0-SNAPSHOT

# Set COGNITION_CHECKPOINT_RESET_ON_STARTUP=true to replay events from the beginning.
cognition.checkpoint.reset-on-startup=false

# LLM retry / rate-limit configuration
# Max retry attempts on transient LLM failures (timeout, 429, 503).
# Set to 1 to disable retries (0 is treated as 1: one attempt, no retry).
cognition.llm.retry.max-attempts=3
# Initial backoff delay in milliseconds; doubles on each attempt (exponential backoff).
cognition.llm.retry.initial-delay-ms=1000
# Maximum backoff delay cap in milliseconds.
cognition.llm.retry.max-delay-ms=30000
# Throttle delay between successive LLM calls in backfill loops (ms).
# Set to 0 for local Ollama; use ~200-500 for rate-limited endpoints (OpenAI, Azure).
cognition.llm.backfill.inter-call-delay-ms=0

# Contradiction resolution
# Maximum number of memories loaded per namespace for pair-wise comparison.
# Limits O(n²) LLM call cost. Namespaces with more memories are truncated to this value.
cognition.contradiction.max-memories-per-namespace=50
# LLM used by the contradiction detector.
cognition.contradiction.llm.provider=ollama
cognition.contradiction.llm.model=llama3.2
cognition.contradiction.llm.temperature=0.1
cognition.contradiction.llm.max-tokens=512
cognition.contradiction.llm.timeout=PT60S

# Scheduler configuration (Phase 1: not yet used)
cognition.scheduler.debounce-delay=PT1M
cognition.scheduler.max-batch-age=PT5M
cognition.scheduler.max-batch-entries=24
cognition.scheduler.max-checkpoint-windows=1000
cognition.scheduler.max-concurrent-jobs=8

# Salience filtering
# All properties are optional — built-in defaults apply when absent.
# Uncomment and override only what you need to change.
#
# salience.enabled=true                         # set false to disable all filtering
# salience.threshold=0.3                        # events with score <= threshold are dropped
# salience.min-length=10                        # short messages below this length are low-salience
# salience.pattern.greeting-enabled=true        # filter standalone greetings (hi, hello, ...)
# salience.pattern.acknowledgment-enabled=true  # filter ack phrases (ok, got it, ...)
# salience.pattern.farewell-enabled=true        # filter farewells (bye, see you, ...)
# salience.pattern.filler-enabled=true          # filter filler words (um, uh, hmm, like, ...)
# salience.pattern.thanks-enabled=true          # filter thanks (thanks, thank you, ...)
# salience.keywords.list=error,bug,deploy,...   # inline list (highest priority; overrides file and bundled defaults)
# salience.keywords.file=/path/to/keywords.txt  # external file (overrides bundled defaults)
# salience.metrics.enabled=true                 # track filtered/kept event counts and score distribution

# Native image: register the bundled keyword file so the classpath resource is
# available when running as a native binary (-Pnative). Without this entry,
# getResourceAsStream returns null and keyword matching is silently disabled.
quarkus.native.resources.includes=salience/default-keywords.txt

# OpenAPI
quarkus.smallrye-openapi.info-title=Cognitive Memory API
quarkus.smallrye-openapi.info-version=${quarkus.application.version:1.0.0-SNAPSHOT}
quarkus.smallrye-openapi.info-description=REST API for the Cognitive Memory processor. \
  Provides management, monitoring, and inspection endpoints for the cognition layer \
  that extracts salient memories from AI agent conversations.
quarkus.smallrye-openapi.store-schema-directory=../site/public

# Quarkus HTTP
quarkus.http.port=8090

# CORS - allow memory-service developer frontend to call cognition processor APIs
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=${COGNITION_CORS_ORIGINS:http://localhost:8082}
quarkus.http.cors.methods=GET,POST,PUT,DELETE,OPTIONS
quarkus.http.cors.headers=Content-Type,Authorization,X-API-Key

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.github.rigazilla.memory".level=DEBUG

# Enable LangChain4j request/response logging
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG

# Keep console logging
quarkus.log.console.enable=true

# Enable file logging
quarkus.log.file.enable=true

# Log file location
quarkus.log.file.path=logs/quarkus.log

# LangChain4j Provider Configuration
# Available providers: ollama, openai, vertex-ai-gemini

# Global REST client timeouts (fallback)
quarkus.rest-client.read-timeout=120000
quarkus.rest-client.connect-timeout=30000

# Named model: "memory" - for extraction and verification
# Provider options: ollama, openai, vertex-ai-gemini
quarkus.langchain4j.memory.chat-model.provider=${COGNITION_MEMORY_MODEL_PROVIDER:openai}


# OpenAI configuration (used when provider=openai)
quarkus.langchain4j.openai.memory.base-url=${COGNITION_OPENAI_BASE_URL:https://api.openai.com/v1}
quarkus.langchain4j.openai.memory.api-key=${COGNITION_OPENAI_API_KEY}
quarkus.langchain4j.openai.memory.timeout=120s
quarkus.langchain4j.openai.memory.log-requests=true
quarkus.langchain4j.openai.memory.log-responses=true
quarkus.langchain4j.openai.memory.chat-model.model-name=${COGNITION_OPENAI_MODEL_NAME:gpt-4o}
quarkus.langchain4j.openai.memory.chat-model.temperature=0.1
quarkus.langchain4j.openai.memory.chat-model.max-completion-tokens=8192

# Ollama configuration (used when provider=ollama)
quarkus.langchain4j.ollama.memory.base-url=http://localhost:11434
quarkus.langchain4j.ollama.memory.timeout=120s
quarkus.langchain4j.ollama.memory.log-requests=true
quarkus.langchain4j.ollama.memory.log-responses=true
quarkus.langchain4j.ollama.memory.chat-model.temperature=0.1

# Example Gemini configuration (uncomment to use):
# quarkus.langchain4j.memory.chat-model.provider=vertex-ai-gemini
# quarkus.langchain4j.memory.chat-model.model-id=gemini-1.5-flash
# quarkus.langchain4j.memory.chat-model.temperature=0.1
# quarkus.langchain4j.memory.chat-model.max-tokens=4096

