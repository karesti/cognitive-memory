# Cognition Processor Configuration

# Memory Service gRPC connection
# Memory Service exposes gRPC on the same HTTP port using HTTP/2
# Docker Compose maps internal 8080 to external 8082
memory-service.grpc.host=localhost
memory-service.grpc.port=8082

# Memory Service authentication and authorization
# API key: dedicated key for cognition_processor client (must match MEMORY_SERVICE_API_KEYS_COGNITION_PROCESSOR)
# Client ID: must be listed in MEMORY_SERVICE_ROLES_ADMIN_CLIENTS for admin role
# NOTE: Use underscore not dash - memory-service converts env var names to lowercase with underscores
memory-service.api-key=${MEMORY_SERVICE_API_KEY}
memory-service.client-id=cognition_processor

# Worker identity (must match API key's client_id for checkpoint auth)
# cognition-processor-key-123 has client_id="cognition_processor" in memory-service
cognition.worker.id=cognition_processor
cognition.runtime.id=cognition-processor-v1
cognition.runtime.version=1.0.0-SNAPSHOT

# Set COGNITION_CHECKPOINT_RESET_ON_STARTUP=true to replay events from the beginning.
cognition.checkpoint.reset-on-startup=false

# Scheduler configuration (Phase 1: not yet used)
cognition.scheduler.debounce-delay=PT1M
cognition.scheduler.max-batch-age=PT5M
cognition.scheduler.max-batch-entries=24
cognition.scheduler.max-checkpoint-windows=1000
cognition.scheduler.max-concurrent-jobs=8

# Quarkus HTTP
quarkus.http.port=8090

# Logging
quarkus.log.level=INFO
quarkus.log.category."io.github.rigazilla.memory".level=DEBUG

# Enable LangChain4j request/response logging
quarkus.log.category."dev.langchain4j".level=DEBUG
quarkus.log.category."io.quarkiverse.langchain4j".level=DEBUG

# Keep console logging
quarkus.log.console.enable=true

# Enable file logging
quarkus.log.file.enable=true

# Log file location
quarkus.log.file.path=logs/quarkus.log

quarkus.log.category."io.quarkus.config".level=DEBUG
quarkus.log.category."io.smallrye.config".level=DEBUG

# Increase HTTP client timeout for LLM calls (default is 10s)
# Configure the REST client used by LangChain4j
quarkus.rest-client."dev.langchain4j.model.ollama.OllamaClient".read-timeout=120000
quarkus.rest-client."dev.langchain4j.model.ollama.OllamaClient".connect-timeout=30000

# Global REST client timeouts (fallback)
quarkus.rest-client.read-timeout=120000
quarkus.rest-client.connect-timeout=30000

# Vert.x HTTP client timeout (used by REST client)
quarkus.vertx.http-client-options.idle-timeout=120
quarkus.vertx.http-client-options.read-idle-timeout=120

# Named model: "memory" - for extraction and verification
# Provider options: ollama, openai, vertex-ai-gemini
quarkus.langchain4j.memory.chat-model.provider=${MEMORY_MODEL_PROVIDER:ollama}
quarkus.langchain4j.memory.chat-model.model-id=${MEMORY_MODEL_ID:llama3.2}
quarkus.langchain4j.memory.chat-model.temperature=0.1
quarkus.langchain4j.memory.chat-model.max-tokens=4096

# Ollama configuration (used when provider=ollama)
quarkus.langchain4j.ollama.memory.timeout=120S

# OpenAI configuration (used when provider=openai)
quarkus.langchain4j.openai.memory.base-url=${OPENAI_BASE_URL:http://localhost:11434/v1}
quarkus.langchain4j.openai.memory.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.memory.chat-model.model-name=${OPENAI_MODEL_NAME:llama3.2}
quarkus.langchain4j.openai.memory.chat-model.temperature=0.1
quarkus.langchain4j.openai.memory.timeout=120s
quarkus.langchain4j.openai.memory.log-requests=true
quarkus.langchain4j.openai.memory.log-responses=true



# Example Gemini configuration (uncomment to use):
# quarkus.langchain4j.memory.chat-model.provider=vertex-ai-gemini
# quarkus.langchain4j.memory.chat-model.model-id=gemini-1.5-flash
# quarkus.langchain4j.memory.chat-model.temperature=0.1
# quarkus.langchain4j.memory.chat-model.max-tokens=4096

# Example Gemini configuration (uncomment to use):
# quarkus.langchain4j.topic-summary.chat-model.provider=vertex-ai-gemini
# quarkus.langchain4j.topic-summary.chat-model.model-id=gemini-1.5-flash
# quarkus.langchain4j.topic-summary.chat-model.temperature=0.3
# quarkus.langchain4j.topic-summary.chat-model.max-tokens=2048

# Disable LangChain4j DevUI features (OpenWebUI container)
quarkus.langchain4j.devui.enabled=false

# ===== Resource Configuration System =====
# Hierarchical configuration for cognitive process resources
# Format: cognition.resources.default.{type}.{property} (global defaults)
#         cognition.process.{processId}.{type}.{property} (process defaults)
#         cognition.process.{processId}.resources.{resourceName}.{type}.{property} (named resource overrides)

# Secrets Provider Configuration
cognition.secrets.provider=env

# Global LLM Defaults
cognition.resources.default.llm.provider=${DEFAULT_LLM_PROVIDER:ollama}
cognition.resources.default.llm.model=${DEFAULT_LLM_MODEL:llama3.2}
cognition.resources.default.llm.temperature=0.1
cognition.resources.default.llm.max-tokens=4096
cognition.resources.default.llm.timeout=120s
cognition.resources.default.llm.base-url=${DEFAULT_LLM_BASE_URL:http://localhost:11434}
cognition.resources.default.llm.api-key-ref=${DEFAULT_LLM_API_KEY_REF:OLLAMA_API_KEY}

# Global API Defaults
cognition.resources.default.api.timeout=30s
cognition.resources.default.api.retry-attempts=3
cognition.resources.default.api.retry-delay=1s

# Global Database Defaults
cognition.resources.default.database.pool-size=10
cognition.resources.default.database.timeout=30s

# Process-Specific Overrides
# Profile consolidation uses higher temperature for creative consolidation
cognition.process.profile-context-consolidation.llm.temperature=0.3

# Named Resource Overrides (examples - currently using defaults)
# cognition.process.durable-memory-extraction.resources.extractor.llm.model=llama3.2
# cognition.process.durable-memory-extraction.resources.verifier.llm.model=llama3.2:70b
