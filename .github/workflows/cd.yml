  docker-build-plain:
    name: Build and Push with Plain Docker Commands
    runs-on: ubuntu-latest
    env:
      QUAY_REPO: rigazilla/cognitive-memory
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build application
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus
      
      - name: Log in to Quay.io
        run: echo "${{ secrets.QUAY_TOKEN }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin
      
      - name: Set image tags
        id: tags
        run: |
          BRANCH=${GITHUB_REF#refs/heads/}
          SHA=${GITHUB_SHA::7}
          echo "main_tag=quay.io/${{ env.QUAY_REPO }}:${BRANCH}-plain" >> $GITHUB_OUTPUT
          echo "sha_tag=quay.io/${{ env.QUAY_REPO }}:${BRANCH}-plain-${SHA}" >> $GITHUB_OUTPUT
          echo "latest_tag=quay.io/${{ env.QUAY_REPO }}:cd-latest-plain" >> $GITHUB_OUTPUT
      
      - name: Build Docker image
        run: |
          docker build \
            -t quay.io/rigazilla/cognitive-memory:my-build \
            -f src/main/docker/Dockerfile.jvm \
            .
        working-directory: cognition-processor-quarkus
      
      - name: Push Docker images
        run: |
          docker push ${{ steps.tags.outputs.main_tag }}
          docker push ${{ steps.tags.outputs.sha_tag }}
          docker push ${{ steps.tags.outputs.latest_tag }}
      #     # cache-to: type=gha,mode=max
