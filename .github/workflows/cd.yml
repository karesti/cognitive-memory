name: CD

on:
  push:
    branches: [main]

jobs:
  docker-build-and-push:
    name: Build, Test and Push Docker Image
    runs-on: ubuntu-latest
    env:
      QUAY_REPO: rigazilla/cognitive-memory
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      
      - name: Build application
        run: ./mvnw -B clean package -DskipTests
        working-directory: cognition-processor-quarkus
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      
      - name: Log in to Quay.io
        uses: docker/login-action@v4
        with:
          registry: quay.io
          username: ${{ secrets.QUAY_USERNAME }}
          password: ${{ secrets.QUAY_TOKEN }}
      
      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: quay.io/${{ env.QUAY_REPO }}
          tags: |
            type=ref,event=branch
            type=sha,prefix={{branch}}-
            type=raw,value=cd-latest
      
      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./cognition-processor-quarkus
          file: ./cognition-processor-quarkus/src/main/docker/Dockerfile.jvm
          # load:true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          push: true
          # Temporarily disabled cache to debug build issues
          # cache-from: type=gha
          # cache-to: type=gha,mode=max
      
